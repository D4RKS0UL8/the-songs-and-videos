<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D4RKS0UL's Aero 15X Sharepoint</title>
    
    <link rel="icon" type="image/png" href="siteicon.png">
    
    <style>
        @font-face {
                font-family: 'SFProDisplay';
                src: url('SFProDisplay-Bold.otf');
        }

        .angelone-header {
                font-family: 'ANGELONE', sans-serif !important;
                color: #D62D2D; 
                letter-spacing: 5px; 
                font-size: 1.8rem; 
                text-transform: uppercase; 
                margin-top: 40px; 
                text-shadow: 0 0 100px rgba(255, 0, 0, 0.9), 0 0 20px rgba(255, 0, 0, 0.8), 0 0 30px rgba(255, 0, 0, 0.3);
        }
        body { 
                font-family: 'AKIRA', sans-serif; 
                color: white; 
                padding: 20px 20px 80px 20px; 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                margin: 0; 
                background-color: #0b0c10;
                background-image: 
                        radial-gradient(at 10% 20%, rgba(212, 175, 55, 0.26) 0px, transparent 45%),
                        radial-gradient(at 90% 10%, rgba(153, 0, 0, 0.22) 0px, transparent 50%),
                        radial-gradient(at 80% 80%, rgba(196, 212, 55, 0.08) 0px, transparent 45%),
                        radial-gradient(at 20% 85%, rgba(90, 31, 70, 0.07) 0px, transparent 50%);
                background-attachment: fixed;
                background-size: 200% 200%;
                animation: appleMeshAnimation 25s ease infinite alternate;
        }

        @keyframes appleMeshAnimation {
                0% { background-position: 0% 15%; }
                50% { background-position: 100% 85%; }
                100% { background-position: 30% 0%; }
        }
        #file-list { width: 100%; max-width: 500px; }

        .file-card {
                background: linear-gradient(135deg, rgba(20, 20, 25, 0.7) 0%, rgba(10, 10, 12, 0.85) 100%);
                margin: 25px 0;
                padding: 30px; 
                border-radius: 20px;
                position: relative;
                cursor: pointer;
                transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
                display: flex;
                flex-direction: column; 
                gap: 12px; 
                border: 1px solid rgba(255, 255, 255, 0.02); 
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1), inset 0 -1px 2px rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(16px) saturate(140%);
                outline: none !important;
                -webkit-tap-highlight-color: transparent !important;
                overflow: hidden !important; 
        }

        .file-card::before {
                content: "";
                position: absolute;
                inset: 0; 
                border-radius: 20px;
                background: radial-gradient(230px circle at var(--mouse-x, 0px) var(--mouse-y, 0px), rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 40%, transparent 70%);
                pointer-events: none;
                transition: opacity 0.3s ease;
                opacity: 0;
                z-index: 1;
        }

        .legal-footer {
                text-align: center;
                padding: 40px 0 20px 0;
                color: #444;
                font-size: 13px;
                letter-spacing: 2px;
                text-transform: uppercase;
                text-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
                width: 100%;
        }

        .file-card:hover::before { opacity: 1; transition: opacity 0.2s ease; }
        .file-card:hover { transform: translateY(-9px) scale(1.01); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(255, 255, 255, 0.03), inset 0 1px 2px rgba(255, 255, 255, 0.2); }
        .file-name { font-family: 'SFProDisplay', sans-serif !important; font-weight: bold; margin: 0; display: block; font-size: 1.15rem; color: #f5f5f7; letter-spacing: 1px; }

        .suggestion-tag {
                position: relative;
                align-self: flex-start;
                font-size: 10px;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: #ffd700;
                text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
                margin-bottom: 5px;
        }

        audio {
                width: 100%;
                height: 40px;
                border-radius: 40px; 
                border: none !important; 
                outline: none !important;
                position: relative;
                z-index: 2;
                transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
                opacity: 0.9;
                background: transparent !important;
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
        }

        audio::-webkit-media-controls-enclosure {
                background-color: rgba(255, 255, 255, 0.092) !important;
                border-radius: 60px;
                padding: 0 11px;
                box-shadow: inset 0 1px 0px rgba(255, 255, 255, 0.145), inset 0 -1px 1px rgba(0, 0, 0, 0.315);
                backdrop-filter: blur(215px) saturate(100%) !important;
                -webkit-backdrop-filter: blur(125px) saturate(100%) !important;
        }

        audio::-webkit-media-controls-panel { filter: invert(100%) hue-rotate(300deg) brightness(0.63) contrast(1); }
        audio:hover { opacity: 1; box-shadow: 0 0 30px rgba(255, 255, 255, 0.18); }
        audio:hover::-webkit-media-controls-enclosure { background-color: rgba(255, 255, 255, 0.18) !important; box-shadow: inset 0 1px 0px rgba(255, 255, 255, 0.6), inset 0 -1px 1px rgba(0, 0, 0, 0.2); }

        .ripple { position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%; transform: scale(0); animation: ripple-animation 0.5s ease-out; pointer-events: none; }
        @keyframes ripple-animation { to { transform: scale(4); opacity: 0; } }

        #discord-btn {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #5865F2;
                color: white;
                padding: 10px 15px;
                border-radius: 50px;
                display: flex;
                align-items: center;
                text-decoration: none;
                font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif !important;
                font-weight: 700 !important; 
                letter-spacing: -0.2px;
                font-size: 14px;
                box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
                border: 2px solid transparent;
                transition: all 0.3s ease;
                z-index: 1000;
                overflow: hidden;
        }
        #discord-btn img { width: 20px; height: 20px; margin-right: 10px; }
        #discord-btn:hover { box-shadow: 0 0 25px rgba(88, 101, 242, 0.8); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-3px) scale(1.05); }
        #discord-btn .ripple { background: rgba(255, 255, 255, 0.6); }

        .section-header {
                width: 100%;
                max-width: 500px;
                color: #c7c7c7;
                font-size: 14px;
                letter-spacing: 3px;
                margin: 40px 0 10px 0;
                border-bottom: 1px solid #555;
                padding-bottom: 5px;
                text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.5), 0 0 30px rgba(255, 0, 0, 0.3);
                text-transform: uppercase;
        }

        video { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h1 class="angelone-header">AERO 15XV8 SHAREPOINT</h1>    
    <div id="file-list"></div>

    <a href="https://discord.gg/C8uJddDdAC" target="_blank" id="discord-btn">
        <img src="discordicon.png" alt="Discord">
        JOIN DISCORD
    </a>

<script>
        const GITHUB_USERNAME = 'D4RKS0UL8';
        const REPO_NAME = 'the-songs-and-videos';
        
        // --- MANUALLY FIXED DATA MATRICES TO PREVENT API LOCKOUTS ---
        const normalSongs = [
            { name: "Achilles Come Down.mp3", suggester: "M <3" },
            { name: "As It Was.mp3" },
            { name: "Blissful - Txmy.m4a" },
            { name: "Calvin Harris, Jazzy - Sat.mp3" },
            { name: "DIE OF DEATH OST_ REV.mp3" },
            { name: "Dancin.mp3" },
            { name: "Falling Down - Lil Peep X.mp3" },
            { name: "Last Kiss - Pearl Jam.mp3", suggester: "Anastasia" },
            { name: "Moonlight on the River.mp3", suggester: "Fluxcxhum" },
            { name: "Мы верим.mp3", suggester: "S" },
            { name: "Nightcall Drive.mp3" },
            { name: "Nightcore - After Dark.mp3" },
            { name: "NOTION.mp3" },
            { name: "Ocean Side - $uicideBoy$.mp3", suggester: "J" },
            { name: "Someone Like You - D4RKS0UL_8.m4a" },
            { name: "Superstar.mp3", suggester: "SLIMZ" },
            { name: "Sweater Weather.mp3" },
            { name: "Tek It - Cafun.mp3", suggester: "M <3" },
            { name: "The Perfect Girl.mp3" }
        ];

        const heavySongs = [
            { name: "CHRISTMAS FUNK (Slo.mp3" },
            { name: "did i tell u that i miss u.mp3" },
            { name: "FINAL_ROUND_SUPER_S.mp3" },
            { name: "FUNK TROPICAL (SLOW.mp3" },
            { name: "Give A Ni$$a A Break.mp3", suggester: "fatsamslim" },
            { name: "MONTAGEM FEARLESS SUPER SLOWED.mp3", suggester: "DaddyFerox" },
            { name: "mutilator (slowed).mp3" },
            { name: "NOOT NOOT FUNK (Sup.mp3" },
            { name: "Riot - Three Days Grace.mp3", suggester: "Jadis" },
            { name: "TOCA PESADO.mp3" },
            { name: "TOMA NA MENTE.mp3" },
            { name: "TRETAMENTO.mp3" },
            { name: "Z-SENTAR.mp3" },
            { name: "ZAYLO_-_MONTAGEM_U.mp3" }
        ];

        const discordVideos = [
            { name: "Holy_Edit1.mp4", url: "https://cdn.discordapp.com/attachments/1475185529459970171/1513651109690871888/Download_1.mp4?ex=6a2880f2&is=6a272f72&hm=fb708393135a7a6cf519226fe7b15716627b2db1db17f7c45866339fd45f6b36&" },
            { name: "Holy_Edit2.mp4", url: "https://cdn.discordapp.com/attachments/1448049536600772911/1513667676952596660/youtube-wICuistVQXY.dc440ae2.mp4?ex=6a289060&is=6a273ee0&hm=8bb01511e6d16e346ea061bc2c362af773cc7f72e9a44d717e4a1872315f86e3&" },
            { name: "Holy_Edit.mp4", url: "https://cdn.discordapp.com/attachments/1448049536600772911/1513666515122126938/services-instagram-post-DVgFbLMiPhw-0.db7d408f.mp4?ex=6a288f4b&is=6a273dcb&hm=b9a2efea5438f288730425662697a7d9bb18935dcc3d1915c386409d583fbf35&" },
            { name: "Newedit1.mp4", url: "https://www.youtube.com/watch?v=iDlPvfGpMro" }
        ];

        let currentlyPlayingMedia = null;
        const container = document.getElementById('file-list');

        function buildSectionHeader(title) {
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerText = title;
            container.appendChild(header);
        }

        function createCard(file, type, customUrl = null) {
            const card = document.createElement('div');
            card.className = 'file-card';
            
            if (file.suggester) {
                const tag = document.createElement('div');
                tag.className = 'suggestion-tag';
                tag.innerText = "Suggested by: " + file.suggester;
                card.appendChild(tag);
            }

            const label = document.createElement('span');
            label.className = 'file-name';
            label.innerText = file.name;
            card.appendChild(label);

            const streamUrl = customUrl || `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/${encodeURIComponent(file.name)}`;

            const player = document.createElement(type);
            player.controls = true;
            player.src = streamUrl;
            player.preload = "metadata";
            card.appendChild(player);

            player.addEventListener('play', function() {
                if (currentlyPlayingMedia && currentlyPlayingMedia !== player) {
                    currentlyPlayingMedia.pause();
                }
                currentlyPlayingMedia = player;
            });

            card.addEventListener('mousedown', function(e) {
                if (['AUDIO', 'VIDEO'].includes(e.target.tagName)) return;
                player.load(); 
                createRipple(e, this);
            });

            const trackCoordinates = (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            };

            card.addEventListener('mousemove', trackCoordinates);
            player.addEventListener('mousemove', (e) => {
                e.stopPropagation(); 
                trackCoordinates(e);
            });

            container.appendChild(card);
        }

        function loadStaticLayout() {
            container.innerHTML = ''; 

            if (normalSongs.length > 0) {
                buildSectionHeader('— 01 Music Stream —');
                normalSongs.forEach(file => createCard(file, 'audio'));
            }

            if (heavySongs.length > 0) {
                buildSectionHeader('— 02 Music Stream —');
                heavySongs.forEach(file => createCard(file, 'audio'));
            }

            if (discordVideos.length > 0) {
                buildSectionHeader('— 03 Video Vault —');
                discordVideos.forEach(vid => {
                    createCard({ name: vid.name }, 'video', vid.url);
                });
            }
        }

        function createRipple(e, el) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            el.appendChild(ripple);
            const size = Math.max(el.offsetWidth, el.offsetHeight);
            const rect = el.getBoundingClientRect();
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = e.clientX - rect.left - size/2 + 'px';
            ripple.style.top = e.clientY - rect.top - size/2 + 'px';
            setTimeout(() => ripple.remove(), 500);
        }

        window.addEventListener('DOMContentLoaded', loadStaticLayout);
</script>
