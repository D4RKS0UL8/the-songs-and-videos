        let currentTrackIndex = -1;

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function togglePlayPause() {
            if (!currentlyPlayingMedia) return;
            if (currentlyPlayingMedia.paused) {
                currentlyPlayingMedia.play();
                document.getElementById('np-play-btn').innerText = '⏸';
            } else {
                currentlyPlayingMedia.pause();
                document.getElementById('np-play-btn').innerText = '▶';
            }
        }

        function seekTrack(e) {
            if (!currentlyPlayingMedia || !currentlyPlayingMedia.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const newTime = (clickX / rect.width) * currentlyPlayingMedia.duration;
            currentlyPlayingMedia.currentTime = newTime;
        }

        function playNextTrack() {
            if (trackList.length === 0 || currentTrackIndex === -1) return;
            const nextIndex = (currentTrackIndex + 1) % trackList.length;
            playTrackByIndex(nextIndex);
        }

        function playPrevTrack() {
            if (trackList.length === 0 || currentTrackIndex === -1) return;
            const prevIndex = (currentTrackIndex - 1 + trackList.length) % trackList.length;
            playTrackByIndex(prevIndex);
        }

        function playTrackByIndex(index) {
            if (index < 0 || index >= trackList.length) return;
            currentTrackIndex = index;
            const track = trackList[index];

            if (currentlyPlayingMedia && currentlyPlayingMedia !== track.audioObj) {
                currentlyPlayingMedia.pause();
            }

            currentlyPlayingMedia = track.audioObj;
            document.getElementById('np-title').innerText = track.name;
            document.getElementById('now-playing-bar').classList.add('active');

            currentlyPlayingMedia.currentTime = 0;
            currentlyPlayingMedia.play();
            document.getElementById('np-play-btn').innerText = '⏸';

            currentlyPlayingMedia.ontimeupdate = () => {
                const cur = currentlyPlayingMedia.currentTime;
                const dur = currentlyPlayingMedia.duration || 0;
                const pct = dur ? (cur / dur) * 100 : 0;
                document.getElementById('np-progress-bar').style.width = `${pct}%`;
                document.getElementById('np-curr-time').innerText = formatTime(cur);
                document.getElementById('np-total-time').innerText = formatTime(dur);
            };

            currentlyPlayingMedia.onended = () => {
                playNextTrack();
            };
        }

        function createRipple(e, element) {
            const circle = document.createElement('span');
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            const rect = element.getBoundingClientRect();
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.className = 'ripple-effect';
            const oldRipple = element.querySelector('.ripple-effect');
            if (oldRipple) oldRipple.remove();
            element.appendChild(circle);
        }

        function createCard(file, type, customUrl = null, suggestedBy = null, targetContainer) {
            const card = document.createElement('div');
            card.className = 'file-card';
            
            const suggester = suggestedBy || file.suggester;
            if (suggester) {
                const tag = document.createElement('div');
                tag.className = 'suggestion-tag';
                tag.innerText = "Suggested by: " + suggester;
                card.appendChild(tag);
            }

            const label = document.createElement('span');
            label.className = 'file-name';
            label.innerText = file.name;
            card.appendChild(label);

            const streamUrl = customUrl || `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/${encodeURIComponent(file.name)}`;

            let player;
            if (type === 'audio') {
                player = document.createElement('audio');
                player.controls = true;
                player.src = streamUrl;
                player.preload = "metadata";

                const trackIdx = trackList.length;
                trackList.push({ name: file.name, audioObj: player });

                player.addEventListener('play', function() {
                    trackList.forEach(item => {
                        if (item.audioObj !== player) item.audioObj.pause();
                    });
                    
                    currentTrackIndex = trackIdx;
                    currentlyPlayingMedia = player;
                    document.getElementById('np-title').innerText = file.name;
                    document.getElementById('now-playing-bar').classList.add('active');
                    document.getElementById('np-play-btn').innerText = '⏸';

                    player.ontimeupdate = () => {
                        const cur = player.currentTime;
                        const dur = player.duration || 0;
                        const pct = dur ? (cur / dur) * 100 : 0;
                        document.getElementById('np-progress-bar').style.width = `${pct}%`;
                        document.getElementById('np-curr-time').innerText = formatTime(cur);
                        document.getElementById('np-total-time').innerText = formatTime(dur);
                    };

                    player.onended = () => playNextTrack();
                });

                player.addEventListener('pause', function() {
                    if (currentlyPlayingMedia === player) {
                        document.getElementById('np-play-btn').innerText = '▶';
                    }
                });
            } else if (streamUrl.includes('youtube.com/embed/')) {
                player = document.createElement('div');
                player.style.width = "100%";
                player.style.aspectRatio = "9/16";
                player.style.position = "relative";
                player.style.cursor = "pointer";
                player.style.borderRadius = "8px";
                player.style.overflow = "hidden";
                player.style.background = "#000";

                const videoId = streamUrl.split('embed/')[1].split('?')[0];

                const img = document.createElement('img');
                img.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                img.style.width = "100%";
                img.style.height = "100%";
                img.style.objectFit = "cover";
                img.style.opacity = "0.8";

                const playBtn = document.createElement('button');
                playBtn.innerText = "▶";
                playBtn.style.position = "absolute";
                playBtn.style.top = "50%";
                playBtn.style.left = "50%";
                playBtn.style.transform = "translate(-50%, -50%)";
                playBtn.style.background = "rgba(255, 0, 0, 0.8)";
                playBtn.style.color = "white";
                playBtn.style.border = "none";
                playBtn.style.borderRadius = "12px";
                playBtn.style.padding = "15px 25px";
                playBtn.style.fontSize = "1.5rem";
                playBtn.style.pointerEvents = "none";

                player.appendChild(img);
                player.appendChild(playBtn);

                player.addEventListener('click', function() {
                    const iframe = document.createElement('iframe');
                    iframe.setAttribute('src', `${streamUrl}?autoplay=1`);
                    iframe.setAttribute('frameborder', '0');
                    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
                    iframe.setAttribute('allowfullscreen', '1');
                    iframe.style.width = "100%";
                    iframe.style.height = "100%";
                    iframe.style.position = "absolute";
                    iframe.style.top = "0";
                    iframe.style.left = "0";
                    iframe.style.borderRadius = "8px";
                    
                    this.innerHTML = '';
                    this.appendChild(iframe);
                });
            } else {
                player = document.createElement(type);
                player.controls = true;
                player.src = streamUrl;
                player.preload = "metadata";

                player.addEventListener('play', function() {
                    if (currentlyPlayingMedia && currentlyPlayingMedia !== player) {
                        currentlyPlayingMedia.pause();
                    }
                    currentlyPlayingMedia = player;
                    document.getElementById('now-playing-bar').classList.remove('active');
                });
            }
            card.appendChild(player);

            card.addEventListener('mousedown', function(e) {
                if (['AUDIO', 'VIDEO', 'IFRAME'].includes(e.target.tagName)) return;
                if (typeof player.load === 'function') player.load(); 
                createRipple(e, this);
            });

            const trackCoordinates = (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            };

            card.addEventListener('mousemove', trackCoordinates);
            if (player.tagName !== 'IFRAME') {
                player.addEventListener('mousemove', (e) => {
                    e.stopPropagation(); 
                    trackCoordinates(e);
                });
            }

            targetContainer.appendChild(card);
        }

        async function loadRepositoryManifest() {
            const container = document.getElementById('mediaContainer');
            const videoContainer = document.getElementById('videoContainer');
            if (!container || !videoContainer) return;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Repository data unavailable');
                
                const files = await response.json();
                container.innerHTML = ''; 
                videoContainer.innerHTML = '';
                trackList = [];

                const songs = files.filter(f => 
                    (f.name.endsWith('.mp3') || f.name.endsWith('.m4a')) &&
                    !f.name.toLowerCase().includes('funk') && 
                    !f.name.toLowerCase().includes('montagem') &&
                    !f.name.includes('FINAL_ROUND_SUPER_SLOWED.mp3') &&
                    !f.name.includes('HOLLOW') &&
                    !f.name.includes('HARDTEKK') &&
                    !f.name.includes('𝐦𝐮𝐭𝐢𝐥𝐚𝐭𝐨𝐫 (𝐬𝐥𝐨𝐰𝐞𝐝).mp3') &&
                    !f.name.includes('Z-SENTAR') && !f.name.includes('TOCA PESADO') && 
                    !f.name.includes('JOGO MORTO') && !f.name.includes('TOMA NA MENTE') &&
                    !f.name.includes('TRETAMENTO')
                );

                const songies = files.filter(f => 
                    (f.name.endsWith('.mp3') || f.name.endsWith('.m4a')) &&
                    (f.name.toLowerCase().includes('funk') || 
                     f.name.toLowerCase().includes('montagem') ||
                     f.name.includes('FINAL_ROUND_SUPER_SLOWED.mp3') ||
                     f.name.includes('HOLLOW') ||
                     f.name.includes('𝐦𝐮𝐭𝐢𝐥𝐚𝐭𝐨𝐫 (𝐬𝐥𝐨𝐰𝐞𝐝).mp3') ||
                     f.name.includes('Z-SENTAR') || f.name.includes('TOCA PESADO') || 
                     f.name.includes('JOGO MORTO') || f.name.includes('TOMA NA MENTE') ||
                     f.name.includes('TRETAMENTO'))
                );

                const gitHubVideos = files.filter(f => f.name.endsWith('.mp4') || f.name.endsWith('.mov'));

                function buildSectionHeader(title, dest) {
                    const header = document.createElement('div');
                    header.className = 'section-header';
                    header.innerText = title;
                    dest.appendChild(header);
                }

                if (songs.length > 0) {
                    buildSectionHeader('— 01 Music Stream —', container);
                    songs.forEach(file => createCard(file, 'audio', null, null, container));
                }

                if (songies.length > 0) {
                    buildSectionHeader('— 02 Music Stream —', container);
                    songies.forEach(file => createCard(file, 'audio', null, null, container));
                }

                if (gitHubVideos.length > 0 || discordVideos.length > 0) {
                    buildSectionHeader('— 03 Video Vault —', videoContainer);
                    gitHubVideos.forEach(file => createCard(file, 'video', null, null, videoContainer));
                    discordVideos.forEach(vid => {
                        createCard({ name: vid.name }, 'video', vid.url, vid.suggestedBy, videoContainer);
                    });
                }

            } catch (error) {
                console.error('Error sorting tracks:', error);
                container.innerHTML = '<div class="section-header" style="color:#ff453a; border-color:#ff453a;">CONNECTION ERROR</div>';
            }
        }

        // --- CHAT ENGINE & ANIMATIONS ---
        let currentUser = localStorage.getItem('chat_user') || null;
        let authMode = 'login'; 
        let showRequestsPanel = false;
        let activeChatTarget = null;

        let lastFeedbackMsg = "";
        let lastFeedbackType = ""; 

        const numberWords = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];

        let userState = {
            incomingRequests: [],
            friendsList: [],
            chatLogs: {} 
        };

        function toggleChat(show) {
            const overlay = document.getElementById('chat-overlay');
            const msgBtn = document.getElementById('messages-btn');

            if (show) {
                // Button jumps down out of view, overlay fades in and slides app up
                msgBtn.classList.add('hide-down');
                overlay.classList.add('active');
                showRequestsPanel = false;
                activeChatTarget = null;
                lastFeedbackMsg = "";
                lastFeedbackType = "";
                if (currentUser) syncUserData();
                renderChatSystem();
            } else {
                // Button jumps back up, overlay fades out and app slides down
                msgBtn.classList.remove('hide-down');
                overlay.classList.remove('active');
            }
        }

        function toggleAuthMode() {
            authMode = (authMode === 'login') ? 'signup' : 'login';
            renderChatSystem();
        }

        function toggleRequestsPanel() {
            showRequestsPanel = !showRequestsPanel;
            renderChatSystem();
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('auth-password');
            const toggleIcon = document.getElementById('password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.src = 'eye-open.png';
            } else {
                passwordInput.type = 'password';
                toggleIcon.src = 'eye-closed.png';
            }
        }

        function generateRequestString() {
            const reqs = userState.incomingRequests;
            if (reqs.length === 0) return `${currentUser} has zero pending friend requests.`;
            const countWord = numberWords[reqs.length] || reqs.length;
            const targetPhrase = reqs.length === 1 ? "friend request" : "friend requests";
            if (reqs.length === 1) return `${currentUser} has ${countWord} ${targetPhrase} from ${reqs[0]}`;
            const allButLast = reqs.slice(0, -1).join(', ');
            const last = reqs[reqs.length - 1];
            return `${currentUser} has ${countWord} ${targetPhrase} from ${allButLast} and ${last}`;
        }

        async function syncUserData() {
            try {
                const response = await fetch(PROXY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'sync_data', username: currentUser })
                });
                if (response.ok) {
                    const data = await response.json();
                    if(data.userState) {
                        userState = data.userState;
                        renderChatSystem();
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function addFriend() {
            const targetFriendInput = document.getElementById('friend-username');
            const targetFriend = targetFriendInput.value.trim();
            if (!targetFriend) return;

            try {
                const response = await fetch(PROXY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send_request', from: currentUser, to: targetFriend })
                });
                const data = await response.json();
                
                if (response.ok) {
                    lastFeedbackMsg = `friend request was sent to ${targetFriend} successfully`;
                    lastFeedbackType = "success";
                    targetFriendInput.value = '';
                    await syncUserData();
                } else {
                    if (data.code === 'USER_NOT_FOUND' || response.status === 404) {
                        lastFeedbackMsg = `${targetFriend} is not an existing account, check spelling and try again`;
                    } else {
                        lastFeedbackMsg = data.message || `Could not send request to ${targetFriend}`;
                    }
                    lastFeedbackType = "error";
                    renderChatSystem();
                }
            } catch (err) {
                lastFeedbackMsg = "Connection issue occurred while looking up account.";
                lastFeedbackType = "error";
                renderChatSystem();
            }
        }

        async function acceptRequest(sender) {
            try {
                const response = await fetch(PROXY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'accept_request', username: currentUser, target: sender })
                });
                if (response.ok) await syncUserData();
            } catch (err) {
                console.error(err);
            }
        }

        function openChatWithFriend(friendName) {
            activeChatTarget = friendName;
            renderChatSystem();
        }

        function closeActiveChat() {
            activeChatTarget = null;
            renderChatSystem();
        }

        async function triggerSendMessage() {
            const inputField = document.getElementById('chat-message-input');
            const messageText = inputField.value.trim();
            if (!messageText || !activeChatTarget) return;

            const now = new Date();
            const timestampString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const logPayload = {
                name: currentUser,
                input: messageText,
                datetime: timestampString
            };

            try {
                const response = await fetch(PROXY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send_message', username: currentUser, target: activeChatTarget, message: logPayload })
                });
                if (response.ok) {
                    inputField.value = '';
                    await syncUserData();
                }
            } catch (err) {
                console.error(err);
            } 
        }
        function renderChatSystem() {
            const container = document.getElementById('chat-system-content');
            const backBtn = document.getElementById('header-back-action');
            const titleText = document.getElementById('header-title-text');
            
            if (currentUser && activeChatTarget) {
                backBtn.setAttribute('onclick', 'closeActiveChat()');
                titleText.innerText = activeChatTarget.toUpperCase();
                
                let messagesHTML = '';
                const logs = userState.chatLogs[activeChatTarget] || [];
                logs.forEach(msg => {
                    messagesHTML += `
                        <div class="msg-bubble">
                            <div class="msg-meta">${msg.name}</div>
                            <div>${msg.input}</div>
                            <div class="msg-time">${msg.datetime}</div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="chat-view-container">
                        <div class="messages-log-area">
                            ${messagesHTML || '<div class="empty-friends" style="margin-top:auto;margin-bottom:auto;">No messages yet. Say hello!</div>'}
                        </div>
                        <div class="chat-input-bar">
                            <input type="text" id="chat-message-input" class="auth-input" style="flex:1;" placeholder="Type a message...">
                            <button class="auth-btn" style="margin-top:0; padding:0 20px;" onclick="triggerSendMessage()">Send</button>
                        </div>
                    </div>
                `;
                return;
            }

            backBtn.setAttribute('onclick', 'toggleChat(false)');
            titleText.innerText = "MESSAGES";

            if (!currentUser) {
                if (authMode === 'login') {
                    container.innerHTML = `
                        <div class="auth-container">
                            <h2>ACCOUNT LOGIN</h2>
                            <input type="text" id="auth-username" class="auth-input" placeholder="Username">
                            <div class="password-wrapper">
                                <input type="password" id="auth-password" class="auth-input" placeholder="Password">
                                <img src="eye-closed.png" class="password-toggle-btn" id="password-toggle" onclick="togglePasswordVisibility()">
                            </div>
                            <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth('login')">Login</button>
                            <div class="auth-toggle-text" onclick="toggleAuthMode()">Don't have an account? Sign Up</div>
                            <div style="text-align: center; font-size: 11px; color: #666; margin-top: 15px; font-family: 'SFProDisplay', sans-serif; letter-spacing: 0.5px; line-height: 1.6; text-transform: none;">
    note: make sure you note your login down before signing up<br>
    capital letters and small letters count so be careful<br>
    if you somehow forgot your password or username dm me on discord:<br>
    <span style="color: #ff416c; font-weight: bold;">d4rks0ul_8</span>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="auth-container">
                            <h2>CREATE ACCOUNT</h2>
                            <input type="text" id="auth-username" class="auth-input" placeholder="Choose Username">
                            <div class="password-wrapper">
                                <input type="password" id="auth-password" class="auth-input" placeholder="Choose Password">
                                <img src="eye-closed.png" class="password-toggle-btn" id="password-toggle" onclick="togglePasswordVisibility()">
                            </div>
                            <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth('signup')">Sign Up</button>
                            <div class="auth-toggle-text" onclick="toggleAuthMode()">Already have an account? Login</div>
                            <div style="text-align: center; font-size: 11px; color: #666; margin-top: 15px; font-family: 'SFProDisplay', sans-serif; letter-spacing: 0.5px; line-height: 1.6; text-transform: none;">
    note: make sure you note your login down before signing up<br>
    capital letters and small letters count so be careful<br>
    if you somehow forgot your password or username dm me on discord:<br>
    <span style="color: #ff416c; font-weight: bold;">d4rks0ul_8</span>

                        </div>
                    `;
                }
            } else {
                let requestsPanelHTML = '';
                if (showRequestsPanel) {
                    let actionsHTML = '';
                    userState.incomingRequests.forEach(sender => {
                        actionsHTML += `<button class="action-accept-btn" onclick="acceptRequest('${sender}')">Accept ${sender}</button>`;
                    });
                    requestsPanelHTML = `
                        <div class="requests-list-panel">
                            <div class="request-string-display"><b>Live Requests Summary:</b><br>"${generateRequestString()}"</div>
                            <div class="request-action-row">${actionsHTML || '<span style="color:#666;">No actions pending</span>'}</div>
                        </div>
                    `;
                }

                let friendsListHTML = '';
                userState.friendsList.forEach(friend => {
                    friendsListHTML += `
                        <div class="friend-item" onclick="openChatWithFriend('${friend}')">
                            <span>⚡ ${friend}</span>
                            <span style="color:#ff4b2b; font-size:11px;">OPEN CHAT →</span>
                        </div>
                    `;
                });

                let inputModifierClass = "";
                let feedbackModifierClass = "";
                let displayStyle = "none";

                if (lastFeedbackMsg) {
                    displayStyle = "block";
                    if (lastFeedbackType === "success") {
                        inputModifierClass = "input-success";
                        feedbackModifierClass = "feedback-success";
                    } else {
                        inputModifierClass = "input-error";
                        feedbackModifierClass = "feedback-error";
                    }
                }

                container.innerHTML = `
                    <div class="friends-container">
                        <div class="user-status">
                            <span>Logged in as: <b>${currentUser}</b></span>
                            <span class="logout-link" onclick="handleLogout()">Logout</span>
                        </div>
                        
                        <div class="friend-requests-btn" onclick="toggleRequestsPanel()">
                            [<span>${userState.incomingRequests.length}</span>] Friend Requests
                        </div>

                        ${requestsPanelHTML}

                        <div class="add-friend-bar">
                            <input type="text" id="friend-username" class="auth-input ${inputModifierClass}" style="flex: 1;" placeholder="Friend's Username" oninput="clearFeedbackStyle()">
                            <button class="auth-btn" style="margin-top:0; padding: 0 15px;" onclick="addFriend()">Add</button>
                        </div>
                        <div id="friend-feedback-msg" class="friend-status-feedback ${feedbackModifierClass}" style="display: ${displayStyle};">
                            ${lastFeedbackMsg}
                        </div>
                        
                        <div class="active-chats-header">ACTIVE CHAT LOGS</div>
                        <div style="flex:1; overflow-y:auto;">
                            ${friendsListHTML || '<div class="empty-friends">No active chat channels built yet. Accept requests above to connect.</div>'}
                        </div>
                    </div>
                `;
            }
        }

        function clearFeedbackStyle() {
            const input = document.getElementById('friend-username');
            const label = document.getElementById('friend-feedback-msg');
            if(input) input.classList.remove('input-success', 'input-error');
            if(label) label.style.display = 'none';
            lastFeedbackMsg = "";
            lastFeedbackType = "";
        }

        async function handleAuth(action) {
            const user = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-password').value.trim();
            const btn = document.getElementById('auth-submit-btn');

            if (!user || !pass) {
                alert('Please fill out all fields.');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const response = await fetch(PROXY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, username: user, password: pass })
                });
                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    localStorage.setItem('chat_user', user);
                    currentUser = user;
                    lastFeedbackMsg = "";
                    lastFeedbackType = "";
                    syncUserData();
                } else {
                    alert(data.message || 'An error occurred.');
                }
            } catch (err) {
                alert('Could not connect to the authentication server.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = action === 'login' ? 'Login' : 'Sign Up';
            }
        }

        function handleLogout() {
            localStorage.removeItem('chat_user');
            currentUser = null;
            authMode = 'login';
            lastFeedbackMsg = "";
            lastFeedbackType = "";
            userState = { incomingRequests: [], friendsList: [], chatLogs: {} };
            renderChatSystem();
        }
