<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watermark Commissions</title>
    <style>
        @font-face {
            font-family: 'SFProDisplay';
            src: local('SFProDisplay'), url('https://cdn.jsdelivr.net/gh/D4RKS0UL8/the-songs-and-videos@main/SFPRODISPLAY-BOLD.OTF') format('opentype');
            font-weight: bold;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'SFProDisplay', sans-serif;
            color: white;
            background-color: #050507;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(86, 33, 143, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(143, 33, 75, 0.4), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(33, 114, 143, 0.3), transparent 50%);
            background-size: 200% 200%;
            background-attachment: fixed;
            animation: fluidBlur 15s ease infinite alternate;
            min-height: 100vh;
        }

        @keyframes fluidBlur {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 50% 100%; }
        }

        .header-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(25, 25, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
            backdrop-filter: blur(25px) saturate(150%);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.3);
        }

        .card-gif {
            width: 100%;
            height: 180px;
            border-radius: 16px;
            object-fit: cover;
            background: #000;
            z-index: 2;
        }

        .card-details {
            margin-top: -20px;
            padding: 35px 15px 15px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0 0 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            z-index: 1;
            transform: translateY(0);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
        }
        .detail-row span {
            color: #fff;
            font-weight: bold;
        }

        .btn-red {
            background: linear-gradient(135deg, #a30000, #ff1a1a);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
            font-family: 'SFProDisplay', sans-serif;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-red:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.5);
        }

        /* App-like Modal Overlay */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            width: 90%;
            max-width: 400px;
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            backdrop-filter: blur(30px);
            transform: scale(0.8) translateY(50px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-card.has-error {
            border-color: #ff4757 !important;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.6), inset 0 0 10px rgba(255, 71, 87, 0.3) !important;
        }

        #overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-gif {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: -15px;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .modal-details {
            background: rgba(0,0,0,0.4);
            padding: 30px 15px 15px 15px;
            border-radius: 0 0 20px 20px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 13px;
            color: #ddd;
            text-align: center;
        }

        .form-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-family: 'SFProDisplay', sans-serif;
            text-align: center;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #2ed573;
        }

        /* Custom Vibe Dropdown */
        .custom-dropdown {
            position: relative;
            width: 100%;
            user-select: none;
        }

        .dropdown-trigger {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropdown-trigger:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .dropdown-selected-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-arrow {
            font-size: 11px;
            color: #888;
            transition: transform 0.3s ease;
        }

        .custom-dropdown.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(20, 20, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            backdrop-filter: blur(25px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
            overflow: hidden;
            animation: menuFade 0.2s ease-out;
        }

        @keyframes menuFade {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-dropdown.open .dropdown-menu {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .btn-submit {
            background: linear-gradient(135deg, #1e824c, #2ed573);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            margin-top: 10px;
            font-family: 'SFProDisplay', sans-serif;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-submit:hover {
            box-shadow: 0 10px 25px rgba(46, 213, 115, 0.5);
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 36px;
            height: 36px;
            background: #ff4757;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
            border: 2px solid #222;
            z-index: 10;
        }

        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .status-success { color: #2ed573; }
        .status-error { color: #ff4757; }
        
        .watermark-text {
            --speed: 3.0s;
            text-align: center;
            font-family: sans-serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffb3ba, #ffdfba, #ffffba, #baffc9, #bae1ff, #ffb3ba, #ffdfba, #ffffba, #baffc9, #bae1ff, #ffb3ba);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbWave var(--speed) linear infinite;
            will-change: background-position;
        }

        @keyframes rgbWave {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

    </style>
</head>
<body>
    
    <div class="header-title">WATERMARK COMMISSIONS</div>
    <div class="grid-container" id="grid"></div>

    <div class="watermark-text">more watermarks soon, stay tuned please.</div>
    
    <div id="overlay" onclick="closeModal(event)">
        <div class="modal-card" id="modal" onclick="event.stopPropagation()">
            <div class="close-btn" onclick="closeModal(event)">✕</div>
            <img class="modal-gif" id="m-gif" src="">
            <div class="modal-details" id="m-details"></div>
            
            <div class="form-group">
                <label for="wm-custom-name">Enter name for Watermark</label>
                <input type="text" id="wm-custom-name" class="form-input" placeholder="e.g. D4RKS0UL_8" oninput="clearErrorState()">
            </div>

            <div class="form-group">
                <label>Upload destination:</label>
                <div class="custom-dropdown" id="dest-dropdown">
                    <div class="dropdown-trigger" onclick="toggleDropdown(event)">
                        <div class="dropdown-selected-info" id="selected-info">
                            <span style="color:#aaa;">Select Platform...</span>
                        </div>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="dropdown-menu">
                        <div class="dropdown-item" onclick="selectDestination('YouTube', 'ytb.png')">
                            <img src="ytb.png" alt="YouTube" class="dropdown-icon">
                            <span>YouTube</span>
                        </div>
                        <div class="dropdown-item" onclick="selectDestination('Discord', 'dc.png')">
                            <img src="dc.png" alt="Discord" class="dropdown-icon">
                            <span>Discord</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group" id="dynamic-dest-group" style="display: none;">
                <label id="dynamic-dest-label"></label>
                <input type="text" id="dynamic-dest-input" class="form-input" placeholder="" oninput="clearErrorState()">
            </div>

            <button class="btn-submit" id="submit-btn" onclick="submitOrder()">Submit</button>
            <div class="status-msg" id="status-display"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = 'wms.txt';
        const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1535044053945684088/9yKUQvMohPFSxoa4Di8nFDYDazHGvrwlN-sDE5Zhh4LhZXxjdMVzi35LXUGqR60yvv8K';

        let activeTemplate = "";
        let selectedPlatform = "";

        async function loadTemplates() {
            const grid = document.getElementById('grid');
            try {
                const res = await fetch(WORKER_URL);
                if (!res.ok) throw new Error('Failed');
                const text = await res.text();
                
                const items = text.split(';').filter(i => i.trim() !== '');
                items.forEach(item => {
                    const [gif, name, type, price, availability] = item.split(',');
                    if(!name) return;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img class="card-gif" src="${gif.trim()}">
                        <div class="card-details">
                            <div class="detail-row">wm name: <span>${name.trim()}</span></div>
                            <div class="detail-row">wm type: <span>${type.trim()}</span></div>
                            <div class="detail-row">price: <span>${price.trim()}</span></div>
                            <div class="detail-row">availability: <span>${availability.trim()}</span></div>
                        </div>
                        <button class="btn-red" onclick="openModal('${gif.trim()}', '${name.trim()}', '${type.trim()}', '${price.trim()}', '${availability.trim()}')">GET FOR FREE</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = `<div style="text-align:center; width:100%; color:#ff4757;">Failed to load data from Worker.</div>`;
            }
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            const dd = document.getElementById('dest-dropdown');
            dd.classList.toggle('open');
        }

        function selectDestination(platform, iconSrc) {
            selectedPlatform = platform;
            const selectedInfo = document.getElementById('selected-info');
            selectedInfo.innerHTML = `
                <img src="${iconSrc}" class="dropdown-icon" alt="${platform}">
                <span>${platform}</span>
            `;

            document.getElementById('dest-dropdown').classList.remove('open');

            const dynamicGroup = document.getElementById('dynamic-dest-group');
            const dynamicLabel = document.getElementById('dynamic-dest-label');
            const dynamicInput = document.getElementById('dynamic-dest-input');

            dynamicGroup.style.display = 'flex';
            dynamicInput.value = '';

            if (platform === 'YouTube') {
                dynamicLabel.innerText = "Enter Your YouTube Handle To Get Mentioned (Optional)";
                dynamicInput.placeholder = "e.g. @channel";
            } else if (platform === 'Discord') {
                dynamicLabel.innerText = "Enter Your Discord Username (Required)";
                dynamicInput.placeholder = "e.g. username";
            }

            clearErrorState();
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const dd = document.getElementById('dest-dropdown');
            if (dd && !dd.contains(e.target)) {
                dd.classList.remove('open');
            }
        });

        function openModal(gif, name, type, price, avail) {
            document.getElementById('m-gif').src = gif;
            document.getElementById('m-details').innerHTML = `
                <div class="detail-row">wm name: <span>${name}</span></div>
                <div class="detail-row">wm type: <span>${type}</span></div>
                <div class="detail-row">price: <span>${price}</span></div>
                <div class="detail-row">availability: <span>${avail}</span></div>
            `;
            activeTemplate = name;
            selectedPlatform = "";
            
            document.getElementById('wm-custom-name').value = '';
            document.getElementById('selected-info').innerHTML = `<span style="color:#aaa;">Select Platform...</span>`;
            document.getElementById('dynamic-dest-group').style.display = 'none';
            document.getElementById('dynamic-dest-input').value = '';
            
            clearErrorState();

            const status = document.getElementById('status-display');
            status.style.opacity = '0';
            status.className = 'status-msg';
            
            document.getElementById('overlay').classList.add('active');
        }

        function closeModal(e) {
            if(e) e.stopPropagation();
            document.getElementById('overlay').classList.remove('active');
        }

        function clearErrorState() {
            document.getElementById('modal').classList.remove('has-error');
        }

        async function submitOrder() {
            const customName = document.getElementById('wm-custom-name').value.trim();
            const destHandle = document.getElementById('dynamic-dest-input').value.trim();
            const status = document.getElementById('status-display');
            const btn = document.getElementById('submit-btn');
            const modal = document.getElementById('modal');

            let isInvalid = false;

            if (!customName) {
                isInvalid = true;
            }

            if (selectedPlatform === 'Discord' && !destHandle) {
                isInvalid = true;
            }

            if (isInvalid) {
                modal.classList.add('has-error');
                showStatus('Please fill in all required fields.', 'error');
                return;
            }

            clearErrorState();
            btn.disabled = true;
            btn.innerText = "Sending...";

            const payloadFields = [
                { name: "Requested Text", value: `\`${customName}\``, inline: true },
                { name: "Template Name", value: `\`${activeTemplate}\``, inline: true }
            ];

            if (selectedPlatform) {
                payloadFields.push({ name: "Upload Destination", value: `\`${selectedPlatform}\``, inline: true });
                if (destHandle) {
                    payloadFields.push({ name: selectedPlatform === 'YouTube' ? "YouTube Handle" : "Discord Username", value: `\`${destHandle}\``, inline: true });
                }
            }

            const payload = {
                content: "<@1429031645322936441> **New Watermark Request!** [From Here](https://d4rks0ul8.github.io/the-songs-and-videos/comissions.html)",
                embeds: [{
                    title: "Order Details",
                    color: 16711680,
                    fields: payloadFields,
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showStatus('Request Sent Successfully!', 'success');
                    setTimeout(closeModal, 2000);
                } else {
                    throw new Error('Webhook error');
                }
            } catch (err) {
                showStatus('Failed to send. Try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit";
            }
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status-display');
            status.innerText = msg;
            status.className = `status-msg status-${type}`;
            status.style.opacity = '1';
            
            if(type === 'success') {
                status.animate([
                    { transform: 'scale(0.9)', opacity: 0 },
                    { transform: 'scale(1.1)', opacity: 1 },
                    { transform: 'scale(1)' }
                ], { duration: 400, easing: 'ease-out' });
            }
        }

        window.onload = loadTemplates;
    </script>
</body>
</html>
